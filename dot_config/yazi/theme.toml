# Based of https://github.com/poperigby/gruvbox-dark-yazi

# [flavor]
# dark = "rose-pine"

# : Manager {{{

[mgr]
cwd = { fg = "#83a598" }

# Find
find_keyword  = { fg = "#b8bb26", italic = true }
find_position = { fg = "#fe8019", bg = "reset", italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_selected = { fg = "#b8bb26", bg = "#b8bb26" }
marker_copied   = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934", bg = "#fb4934" }
marker_marked   = { fg = "#83a598", bg = "#83a598" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#282828", bg = "#b8bb26" }
count_cut      = { fg = "#282828", bg = "#fb4934" }
count_selected = { fg = "#282828", bg = "#fabd2f" }

# Border
border_symbol = "│"
border_style  = { fg = "#665c54" }

# : }}}


# : Hovered file {{{

[indicator]
parent  = { fg = "#282828", bg = "#a89984" }
current = { fg = "#282828", bg = "#83a598" }
preview = { underline = true }
padding = { open = "█", close = "█" }

# : }}}


# : Tabs {{{

[tabs]
active    = { fg = "#282828", bg = "#a89984", bold = true }
inactive  = { fg = "#a89984", bg = "#3c3836" }
sep_inner = { open = "█", close = "█" }
sep_outer = { open = "█", close = "█" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#282828", bg = "#a89984", bold = true }
normal_alt  = { fg = "#a89984", bg = "#3c3836" }

select_main = { fg = "#282828", bg = "#b8bb26", bold = true }
select_alt  = { fg = "#b8bb26", bg = "#3c3836" }

unset_main  = { fg = "#282828", bg = "#d3869b", bold = true }
unset_alt   = { fg = "#d3869b", bg = "#3c3836" }

# : }}}


# : Status {{{

[status]
overall   = {}
sep_left  = { open = "█", close = "█" }
sep_right = { open = "█", close = "█" }

# Permissions
perm_sep   = { fg = "#665c54" }
perm_type  = { fg = "#83a598" }
perm_read  = { fg = "#b8bb26" }
perm_write = { fg = "#fb4934" }
perm_exec  = { fg = "#fabd2f" }

# Progress
progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#504945", bg = "#3c3836" }
progress_error  = { fg = "#fb4934", bg = "#3c3836" }

# : }}}


# : Which {{{

[which]
border          = { fg = "#504945" }
mask            = { bg = "#3c3836" }
cand            = { fg = "#83a598" }
rest            = { fg = "#928374" }
desc            = { fg = "#fe8019" }
separator       = "  "
separator_style = { fg = "#504945" }

# : }}}


# : Confirm {{{

[confirm]
border  = { fg = "#bdae93" }
title   = { fg = "#bdae93" }
btn_yes = { fg = "#282828", bg = "#83a598" }
btn_no  = {}

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#504945" }
title    = { fg = "#bdae93" }
tbl_col  = { fg = "#83a598" }
tbl_cell = { fg = "#282828", bg = "#83a598" }

# : }}}


# : Notify {{{

[notify]
title_info  = { fg = "#b8bb26" }
title_warn  = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#504945" }
active   = { fg = "#fe8019", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#bdae93" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border   = { fg = "#504945" }
active   = { fg = "#282828", bg = "#83a598" }
inactive = {}

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#504945" }
title   = {}
hovered = { fg = "#fe8019", underline = true }

# : }}}


# : Help {{{

[help]
border  = { fg = "#504945" }
chord   = { fg = "#fe8019" }
action  = { fg = "#83a598" }
hovered = { bg = "#504945", bold = true }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
	# Images
	{ mime = "**/image/*", fg = "#83a598" },

	# Media
	{ mime = "**/{audio,video}/*", fg = "#b8bb26" },

	# Archives
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fe8019" },

	# Special files
	{ url = "*", is = "orphan", bg = "#fb4934" },
	{ url = "*", is = "exec",   fg = "#b8bb26" },

	# Fallback
	{ url = "*",  fg = "#a89984" },
	{ url = "*/", fg = "#83a598" },
]

# : }}}
